<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nostalgia Snake — Classic Arcade Refined</title>
<style>
  :root {
    --bg: #090d16;
    --panel: #111726;
    --panel-border: rgba(255, 255, 255, 0.08);
    --grid: #0d1322;
    --grid-line: rgba(56, 189, 248, 0.04);
    --snake: #10b981;
    --snake-head: #34d399;
    --snake-glow: rgba(16, 185, 129, 0.35);
    --food: #f43f5e;
    --food-glow: rgba(244, 63, 94, 0.45);
    --bonus: #fbbf24;
    --bonus-glow: rgba(251, 191, 36, 0.5);
    --txt: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-hover: #0ea5e9;
    --btn-bg: #1e293b;
    --btn-txt: #e2e8f0;
    --font: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --radius: 14px;
    --scanlines: none;
  }

  body[data-theme="nokia"] {
    --bg: #879710;
    --panel: #7f8e0f;
    --panel-border: #435205;
    --grid: #94a413;
    --grid-line: rgba(30, 40, 5, 0.08);
    --snake: #202e03;
    --snake-head: #111a01;
    --snake-glow: none;
    --food: #202e03;
    --food-glow: none;
    --bonus: #111a01;
    --bonus-glow: none;
    --txt: #1c2803;
    --muted: #445408;
    --accent: #2b3d04;
    --accent-hover: #1a2702;
    --btn-bg: #74830c;
    --btn-txt: #152002;
    --font: "Courier New", Courier, monospace;
    --radius: 4px;
    --scanlines: none;
  }

  body[data-theme="synthwave"] {
    --bg: #150928;
    --panel: #200f3c;
    --panel-border: rgba(236, 72, 153, 0.25);
    --grid: #130724;
    --grid-line: rgba(236, 72, 153, 0.08);
    --snake: #06b6d4;
    --snake-head: #22d3ee;
    --snake-glow: rgba(6, 182, 212, 0.45);
    --food: #f43f5e;
    --food-glow: rgba(244, 63, 94, 0.6);
    --bonus: #fbbf24;
    --bonus-glow: rgba(251, 191, 36, 0.65);
    --txt: #fdf4ff;
    --muted: #c084fc;
    --accent: #d946ef;
    --accent-hover: #c026d3;
    --btn-bg: #2e1065;
    --btn-txt: #fae8ff;
    --font: ui-monospace, "Cascadia Code", monospace;
    --radius: 12px;
    --scanlines: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
  }

  body[data-theme="midnight"] {
    --bg: #090a0f;
    --panel: #12141c;
    --panel-border: rgba(255, 255, 255, 0.06);
    --grid: #0d0f17;
    --grid-line: rgba(255, 255, 255, 0.02);
    --snake: #6366f1;
    --snake-head: #818cf8;
    --snake-glow: rgba(99, 102, 241, 0.3);
    --food: #ec4899;
    --food-glow: rgba(236, 72, 153, 0.4);
    --bonus: #f59e0b;
    --bonus-glow: rgba(245, 158, 11, 0.45);
    --txt: #e2e8f0;
    --muted: #64748b;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --btn-bg: #1e2230;
    --btn-txt: #cbd5e1;
    --font: ui-monospace, Menlo, Consolas, monospace;
    --radius: 16px;
    --scanlines: none;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font-family: var(--font);
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; gap: 10px; padding: 14px 12px;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    transition: background 0.25s ease, color 0.25s ease;
    overflow-x: hidden;
  }

  /* Retro scanline overlay */
  .scanline-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 99;
    background: var(--scanlines); background-size: 100% 4px;
    opacity: 0.6;
  }

  /* Header & Top Bar */
  .header-container {
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; width: 100%; max-width: 460px;
  }
  .title-row {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; margin-top: 2px;
  }
  h1 {
    font-size: 21px; font-weight: 800; margin: 0; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 8px;
  }
  .badge {
    font-size: 11px; padding: 2px 7px; border-radius: 999px;
    background: var(--btn-bg); color: var(--muted); border: 1px solid var(--panel-border);
  }
  .top-actions {
    display: flex; gap: 6px; align-items: center;
  }
  .icon-btn {
    background: var(--btn-bg); color: var(--txt); border: 1px solid var(--panel-border);
    border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; font-size: 15px; padding: 0;
    transition: background 0.15s, transform 0.1s;
  }
  .icon-btn:hover { background: var(--accent); color: #000; }
  .icon-btn:active { transform: scale(0.94); }

  /* Settings bar */
  .options-bar {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 460px; font-size: 12px; color: var(--muted);
    background: var(--panel); padding: 6px 12px; border-radius: 10px;
    border: 1px solid var(--panel-border); flex-wrap: wrap; gap: 6px;
  }
  .option-group { display: flex; align-items: center; gap: 6px; }
  select, .select-pill {
    background: var(--btn-bg); color: var(--txt); border: 1px solid var(--panel-border);
    border-radius: 6px; font-family: inherit; font-size: 11px; padding: 3px 6px;
    cursor: pointer; outline: none;
  }

  /* Scoreboard */
  .scoreboard {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    width: 100%; max-width: 460px; background: var(--panel);
    padding: 10px 14px; border-radius: var(--radius);
    border: 1px solid var(--panel-border); box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  .stat-box { display: flex; flex-direction: column; align-items: center; }
  .stat-label { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; }
  .stat-val { font-size: 20px; font-weight: 800; }
  .stat-val.score { color: var(--snake); transition: transform 0.15s ease; }
  .stat-val.best { color: var(--accent); }
  .stat-val.combo { color: var(--bonus); }
  .stat-val.pop { transform: scale(1.28); }

  /* Game Canvas Wrapper */
  .canvas-wrap {
    position: relative; width: 100%; max-width: 460px;
    background: var(--panel); padding: 10px; border-radius: var(--radius);
    border: 1px solid var(--panel-border); box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  }
  canvas {
    background: var(--grid); border-radius: calc(var(--radius) - 4px);
    display: block; width: 100%; height: auto; aspect-ratio: 1 / 1;
    image-rendering: -webkit-optimize-contrast;
    touch-action: none;
  }

  /* Floating Overlay inside Canvas */
  .overlay {
    position: absolute; inset: 10px; border-radius: calc(var(--radius) - 4px);
    background: rgba(9, 13, 22, 0.85); backdrop-filter: blur(4px);
    display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 20px; text-align: center;
    z-index: 10; animation: fadeIn 0.2s ease-out;
  }
  .overlay.active { display: flex; }
  .overlay-title { font-size: 26px; font-weight: 800; margin: 0; }
  .overlay-title.over { color: var(--food); }
  .overlay-title.paused { color: var(--accent); }
  .overlay-stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px;
    font-size: 13px; color: var(--muted); margin: 4px 0 10px;
  }
  .overlay-stats strong { color: var(--txt); }
  .high-record-badge {
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff; font-size: 12px; font-weight: 800; padding: 4px 10px;
    border-radius: 999px; letter-spacing: 0.5px; animation: pulseGlow 1.5s infinite;
  }

  /* Action Buttons */
  .primary-btn {
    background: var(--accent); color: #040914; border: none; padding: 10px 22px;
    border-radius: 9px; font-weight: 800; font-family: inherit; font-size: 14px;
    cursor: pointer; box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
    display: inline-flex; align-items: center; gap: 6px;
    transition: transform 0.1s, background 0.15s;
  }
  .primary-btn:hover { background: var(--accent-hover); }
  .primary-btn:active { transform: translateY(1px); }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .ghost-btn {
    background: var(--btn-bg); color: var(--btn-txt); border: 1px solid var(--panel-border);
    padding: 8px 16px; border-radius: 8px; font-weight: 700; font-family: inherit;
    font-size: 13px; cursor: pointer; transition: background 0.15s;
  }
  .ghost-btn:hover { background: rgba(255, 255, 255, 0.1); }

  /* Mobile Virtual D-Pad */
  .dpad-container {
    display: none; flex-direction: column; align-items: center;
    gap: 6px; width: 100%; max-width: 220px; margin-top: 4px;
  }
  .dpad-row { display: flex; gap: 8px; justify-content: center; }
  .dpad-btn {
    width: 58px; height: 50px; background: var(--panel); border: 1px solid var(--panel-border);
    color: var(--txt); border-radius: 12px; font-size: 20px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation; box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    transition: transform 0.08s, background 0.1s;
  }
  .dpad-btn:active { background: var(--accent); color: #000; transform: scale(0.92); }

  /* Footer & Hint */
  .info-bar {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 460px; font-size: 11px; color: var(--muted);
    line-height: 1.4; padding: 0 4px;
  }
  .shortcut-keys kbd {
    background: var(--btn-bg); border: 1px solid var(--panel-border);
    padding: 2px 5px; border-radius: 4px; color: var(--txt); font-size: 10px;
  }

  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.9; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Show virtual D-pad on touch screens or small viewports */
  @media (pointer: coarse), (max-width: 600px) {
    .dpad-container { display: flex; }
    .shortcut-keys { display: none; }
  }
</style>
</head>
<body data-theme="neon">

<div class="scanline-overlay"></div>

<div class="header-container">
  <div class="title-row">
    <h1>🐍 Nostalgia Snake <span class="badge">v2.0</span></h1>
    <div class="top-actions">
      <button id="soundToggle" class="icon-btn" title="Toggle Sound (M)" aria-label="Toggle Sound">🔊</button>
      <button id="themeToggle" class="icon-btn" title="Cycle Theme (T)" aria-label="Cycle Theme">🎨</button>
      <button id="pauseBtn" class="icon-btn" title="Pause Game (Space)" aria-label="Pause Game">⏸</button>
    </div>
  </div>

  <div class="options-bar">
    <div class="option-group">
      <span>Theme:</span>
      <select id="themeSelect" class="select-pill" aria-label="Select Theme">
        <option value="neon">Neon Arcade</option>
        <option value="nokia">Nokia 3310</option>
        <option value="synthwave">80s CRT</option>
        <option value="midnight">Midnight</option>
      </select>
    </div>
    <div class="option-group">
      <span>Mode:</span>
      <select id="modeSelect" class="select-pill" aria-label="Game Mode">
        <option value="classic">Classic (Walls)</option>
        <option value="wrap">Wrap-Around</option>
      </select>
    </div>
    <div class="option-group">
      <span>Speed:</span>
      <select id="speedSelect" class="select-pill" aria-label="Game Speed">
        <option value="relaxed">Relaxed</option>
        <option value="normal" selected>Normal</option>
        <option value="turbo">Turbo</option>
      </select>
    </div>
  </div>
</div>

<div class="scoreboard">
  <div class="stat-box">
    <span class="stat-label">Score</span>
    <span id="scoreVal" class="stat-val score">0</span>
  </div>
  <div class="stat-box">
    <span class="stat-label">Combo</span>
    <span id="comboVal" class="stat-val combo">1x</span>
  </div>
  <div class="stat-box">
    <span class="stat-label">Best</span>
    <span id="bestVal" class="stat-val best">0</span>
  </div>
</div>

<div class="canvas-wrap">
  <canvas id="game" width="460" height="460"></canvas>
  
  <!-- Overlay Card for Pause / Game Over -->
  <div id="gameOverlay" class="overlay">
    <div id="newRecordBadge" class="high-record-badge" style="display: none;">🏆 NEW HIGH SCORE!</div>
    <h2 id="overlayTitle" class="overlay-title over">Game Over</h2>
    
    <div id="overlayStats" class="overlay-stats">
      <div>Final Score: <strong id="statFinalScore">0</strong></div>
      <div>Food Eaten: <strong id="statFoodCount">0</strong></div>
      <div>Max Length: <strong id="statMaxLength">1</strong></div>
      <div>Survive Time: <strong id="statSurviveTime">0s</strong></div>
    </div>

    <div class="btn-row">
      <button id="overlayActionBtn" class="primary-btn">▶ Play Again</button>
      <button id="overlayResumeBtn" class="ghost-btn" style="display:none;">Resume</button>
    </div>
    <div id="overlayHint" style="font-size: 11px; color: var(--muted); margin-top: 4px;">Press Space or Enter to restart</div>
  </div>
</div>

<!-- Virtual Mobile D-Pad -->
<div class="dpad-container" id="dpad">
  <div class="dpad-row">
    <button class="dpad-btn" data-dir="up" aria-label="Up">▲</button>
  </div>
  <div class="dpad-row">
    <button class="dpad-btn" data-dir="left" aria-label="Left">◀</button>
    <button class="dpad-btn" data-dir="down" aria-label="Down">▼</button>
    <button class="dpad-btn" data-dir="right" aria-label="Right">▶</button>
  </div>
</div>

<div class="info-bar">
  <div class="shortcut-keys">
    Controls: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>WASD</kbd> • <kbd>Space</kbd> Pause • <kbd>R</kbd> Restart • <kbd>M</kbd> Mute
  </div>
  <div style="text-align: right;">100% Offline • Pure Arcade</div>
</div>

<script>
(() => {
  "use strict";

  // --- Constants & Configuration ---
  const CANVAS = document.getElementById("game");
  const CTX = CANVAS.getContext("2d");
  const WIDTH = 460;
  const HEIGHT = 460;
  const CELL = 20;
  const COLS = Math.floor(WIDTH / CELL); // 23
  const ROWS = Math.floor(HEIGHT / CELL); // 23
  const STORAGE_BEST_PREFIX = "nostalgia-snake-best-";
  const STORAGE_THEME = "nostalgia-snake-theme";
  const STORAGE_SOUND = "nostalgia-snake-sound";
  const STORAGE_MODE = "nostalgia-snake-mode";
  const STORAGE_SPEED = "nostalgia-snake-speed";

  // --- DOM Elements ---
  const UI = {
    score: document.getElementById("scoreVal"),
    combo: document.getElementById("comboVal"),
    best: document.getElementById("bestVal"),
    overlay: document.getElementById("gameOverlay"),
    overlayTitle: document.getElementById("overlayTitle"),
    overlayActionBtn: document.getElementById("overlayActionBtn"),
    overlayResumeBtn: document.getElementById("overlayResumeBtn"),
    overlayHint: document.getElementById("overlayHint"),
    newRecordBadge: document.getElementById("newRecordBadge"),
    statFinalScore: document.getElementById("statFinalScore"),
    statFoodCount: document.getElementById("statFoodCount"),
    statMaxLength: document.getElementById("statMaxLength"),
    statSurviveTime: document.getElementById("statSurviveTime"),
    soundToggle: document.getElementById("soundToggle"),
    themeToggle: document.getElementById("themeToggle"),
    pauseBtn: document.getElementById("pauseBtn"),
    themeSelect: document.getElementById("themeSelect"),
    modeSelect: document.getElementById("modeSelect"),
    speedSelect: document.getElementById("speedSelect"),
    dpad: document.getElementById("dpad"),
  };

  // --- Procedural Web Audio System ---
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function playTone(freq, type, duration, startVol = 0.15, endVol = 0.001) {
    if (!soundEnabled || !audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(startVol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(endVol, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (_) {}
  }

  function playEatSound(combo = 1) {
    if (!soundEnabled) return;
    initAudio();
    const baseFreq = 440 + Math.min(combo * 60, 480);
    playTone(baseFreq, "sine", 0.08, 0.18);
    setTimeout(() => playTone(baseFreq * 1.33, "sine", 0.1, 0.15), 60);
  }

  function playBonusSound() {
    if (!soundEnabled) return;
    initAudio();
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      setTimeout(() => playTone(freq, "triangle", 0.12, 0.2), idx * 60);
    });
  }

  function playDieSound() {
    if (!soundEnabled) return;
    initAudio();
    try {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(240, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.35);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    } catch (_) {}
  }

  function playClickSound() {
    if (!soundEnabled) return;
    initAudio();
    playTone(600, "sine", 0.04, 0.08);
  }

  function triggerHaptic(duration = 15) {
    if (navigator.vibrate) {
      try { navigator.vibrate(duration); } catch (_) {}
    }
  }

  // --- High-DPI Canvas Rendering Setup ---
  let dpr = window.devicePixelRatio || 1;
  function setupCanvasDPI() {
    dpr = window.devicePixelRatio || 1;
    CANVAS.width = WIDTH * dpr;
    CANVAS.height = HEIGHT * dpr;
    if (CTX.setTransform) {
      CTX.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }
  setupCanvasDPI();
  window.addEventListener("resize", () => {
    setupCanvasDPI();
  });

  // --- Game State Variables ---
  let snake = [];
  let prevSnake = [];
  let dir = { x: 1, y: 0 };
  let inputQueue = [];
  let food = { x: 0, y: 0 };
  let bonusFood = null; // { x, y, timeLeft, maxTime }
  let score = 0;
  let best = 0;
  let foodsEaten = 0;
  let comboCount = 1;
  let lastEatTime = 0;
  let gameStartTime = 0;
  let alive = true;
  let paused = false;
  let mode = "classic"; // "classic" | "wrap"
  let speedPreset = "normal"; // "relaxed" | "normal" | "turbo"
  let theme = "neon";

  // Timing & Interpolation
  let tickMs = 105;
  let acc = 0;
  let lastTime = 0;
  let isNewRecord = false;
  let shakeTime = 0;

  // Visual Effects
  let particles = [];
  let floatTexts = [];
  let tongueProgress = 0;

  // --- Load Persistent Settings ---
  try {
    theme = localStorage.getItem(STORAGE_THEME) || "neon";
    soundEnabled = localStorage.getItem(STORAGE_SOUND) !== "false";
    mode = localStorage.getItem(STORAGE_MODE) || "classic";
    speedPreset = localStorage.getItem(STORAGE_SPEED) || "normal";
  } catch (_) {}

  document.body.setAttribute("data-theme", theme);
  UI.themeSelect.value = theme;
  UI.modeSelect.value = mode;
  UI.speedSelect.value = speedPreset;
  updateSoundUI();
  updateBestScoreDisplay();

  function getBaseTickMs() {
    switch (speedPreset) {
      case "relaxed": return 130;
      case "turbo": return 80;
      default: return 105;
    }
  }
  function getMinTickMs() {
    switch (speedPreset) {
      case "relaxed": return 70;
      case "turbo": return 40;
      default: return 52;
    }
  }

  function updateBestScoreDisplay() {
    const key = STORAGE_BEST_PREFIX + mode + "-" + speedPreset;
    try {
      best = parseInt(localStorage.getItem(key) || "0", 10) || 0;
    } catch (_) {
      best = 0;
    }
    UI.best.textContent = best;
  }

  function saveBestScore() {
    const key = STORAGE_BEST_PREFIX + mode + "-" + speedPreset;
    try {
      localStorage.setItem(key, String(best));
    } catch (_) {}
  }

  function updateSoundUI() {
    UI.soundToggle.textContent = soundEnabled ? "🔊" : "🔇";
    UI.soundToggle.title = soundEnabled ? "Sound: ON (M)" : "Sound: OFF (M)";
  }

  // --- Game Lifecycle ---
  function reset() {
    const midX = Math.floor(COLS / 2);
    const midY = Math.floor(ROWS / 2);
    snake = [
      { x: midX, y: midY },
      { x: midX - 1, y: midY },
      { x: midX - 2, y: midY }
    ];
    prevSnake = snake.map(s => ({ ...s }));
    dir = { x: 1, y: 0 };
    inputQueue = [];
    score = 0;
    foodsEaten = 0;
    comboCount = 1;
    lastEatTime = 0;
    gameStartTime = performance.now();
    alive = true;
    paused = false;
    isNewRecord = false;
    bonusFood = null;
    particles = [];
    floatTexts = [];
    tickMs = getBaseTickMs();
    acc = 0;

    placeFood();
    updateBestScoreDisplay();

    UI.score.textContent = "0";
    UI.combo.textContent = "1x";
    UI.overlay.classList.remove("active");
    UI.pauseBtn.textContent = "⏸";
  }

  function placeFood() {
    let p;
    let attempts = 0;
    do {
      p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      attempts++;
    } while (
      attempts < 300 &&
      (snake.some(s => s.x === p.x && s.y === p.y) ||
       (bonusFood && bonusFood.x === p.x && bonusFood.y === p.y))
    );
    food = p;
  }

  function maybeSpawnBonus() {
    if (bonusFood || Math.random() > 0.4) return;
    let p;
    let attempts = 0;
    do {
      p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      attempts++;
    } while (
      attempts < 300 &&
      (snake.some(s => s.x === p.x && s.y === p.y) || (food.x === p.x && food.y === p.y))
    );
    bonusFood = { x: p.x, y: p.y, timeLeft: 8000, maxTime: 8000 };
  }

  // --- Particles & Floating Text ---
  function spawnParticles(x, y, color, count = 14) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.2 + Math.random() * 3.2;
      particles.push({
        x: x * CELL + CELL / 2,
        y: y * CELL + CELL / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 2 + Math.random() * 3,
        color,
        life: 1.0,
        decay: 0.025 + Math.random() * 0.03
      });
    }
  }

  function spawnFloatText(text, x, y, color) {
    floatTexts.push({
      text,
      x: x * CELL + CELL / 2,
      y: y * CELL + CELL / 2,
      vy: -1.2,
      alpha: 1.0,
      color
    });
  }

  // --- Logical Simulation Step ---
  function step() {
    if (!alive || paused) return;

    // Process queued turn
    if (inputQueue.length > 0) {
      dir = inputQueue.shift();
    }

    // Save previous snapshot for rendering interpolation
    prevSnake = snake.map(s => ({ ...s }));

    let newHeadX = snake[0].x + dir.x;
    let newHeadY = snake[0].y + dir.y;

    // Boundary check
    if (mode === "wrap") {
      if (newHeadX < 0) newHeadX = COLS - 1;
      else if (newHeadX >= COLS) newHeadX = 0;
      if (newHeadY < 0) newHeadY = ROWS - 1;
      else if (newHeadY >= ROWS) newHeadY = 0;
    } else {
      if (newHeadX < 0 || newHeadX >= COLS || newHeadY < 0 || newHeadY >= ROWS) {
        gameOver();
        return;
      }
    }

    const head = { x: newHeadX, y: newHeadY };

    // Self-collision (ignore tail tip if tail will move this turn, but tail won't move if eating)
    const isEating = (head.x === food.x && head.y === food.y) ||
                     (bonusFood && head.x === bonusFood.x && head.y === bonusFood.y);
    const bodyToCheck = isEating ? snake : snake.slice(0, -1);
    if (bodyToCheck.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    // Eating Normal Food
    if (head.x === food.x && head.y === food.y) {
      const now = performance.now();
      if (now - lastEatTime < 4500) {
        comboCount = Math.min(5, comboCount + 1);
      } else {
        comboCount = 1;
      }
      lastEatTime = now;

      const gainedScore = 10 * comboCount;
      score += gainedScore;
      foodsEaten++;

      // UI updates
      UI.score.textContent = score;
      UI.combo.textContent = comboCount + "x";
      UI.score.classList.remove("pop");
      void UI.score.offsetWidth;
      UI.score.classList.add("pop");

      // Audio & Feedback
      playEatSound(comboCount);
      triggerHaptic(20);
      spawnParticles(food.x, food.y, getThemeColor("--food"), 16);
      spawnFloatText(`+${gainedScore}`, food.x, food.y, getThemeColor("--food"));
      if (comboCount > 1) {
        spawnFloatText(`${comboCount}x COMBO!`, food.x, food.y - 1, getThemeColor("--bonus"));
      }

      // Speed progression
      const base = getBaseTickMs();
      const minMs = getMinTickMs();
      tickMs = Math.max(minMs, base - Math.floor(score / 30) * 3);

      placeFood();

      // Bonus spawn chance every 5 foods
      if (foodsEaten % 5 === 0) {
        maybeSpawnBonus();
      }
    }
    // Eating Bonus Food
    else if (bonusFood && head.x === bonusFood.x && head.y === bonusFood.y) {
      const bonusScore = 50 * comboCount;
      score += bonusScore;
      UI.score.textContent = score;
      playBonusSound();
      triggerHaptic(35);
      spawnParticles(bonusFood.x, bonusFood.y, getThemeColor("--bonus"), 24);
      spawnFloatText(`+${bonusScore} BONUS!`, bonusFood.x, bonusFood.y, getThemeColor("--bonus"));
      bonusFood = null;
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    alive = false;
    playDieSound();
    triggerHaptic(80);
    shakeTime = 300;

    if (score > best) {
      best = score;
      isNewRecord = true;
      saveBestScore();
      UI.best.textContent = best;
    }

    const elapsedSeconds = Math.max(1, Math.round((performance.now() - gameStartTime) / 1000));
    UI.overlayTitle.textContent = "Game Over";
    UI.overlayTitle.className = "overlay-title over";
    UI.newRecordBadge.style.display = isNewRecord ? "inline-block" : "none";
    UI.statFinalScore.textContent = score;
    UI.statFoodCount.textContent = foodsEaten;
    UI.statMaxLength.textContent = snake.length;
    UI.statSurviveTime.textContent = elapsedSeconds + "s";

    UI.overlayActionBtn.textContent = "▶ Play Again";
    UI.overlayResumeBtn.style.display = "none";
    UI.overlayHint.textContent = "Press Space or Enter to restart";
    UI.overlay.classList.add("active");
  }

  function togglePause() {
    if (!alive) return;
    initAudio();
    paused = !paused;
    playClickSound();

    if (paused) {
      UI.pauseBtn.textContent = "▶";
      UI.overlayTitle.textContent = "Game Paused";
      UI.overlayTitle.className = "overlay-title paused";
      UI.newRecordBadge.style.display = "none";
      UI.statFinalScore.textContent = score;
      UI.statFoodCount.textContent = foodsEaten;
      UI.statMaxLength.textContent = snake.length;
      const elapsedSeconds = Math.max(1, Math.round((performance.now() - gameStartTime) / 1000));
      UI.statSurviveTime.textContent = elapsedSeconds + "s";

      UI.overlayActionBtn.textContent = "↺ Restart";
      UI.overlayResumeBtn.style.display = "inline-flex";
      UI.overlayHint.textContent = "Press Space to resume";
      UI.overlay.classList.add("active");
    } else {
      UI.pauseBtn.textContent = "⏸";
      UI.overlay.classList.remove("active");
      lastTime = performance.now();
    }
  }

  // --- Visual Helper: Theme Colors ---
  function getThemeColor(varName) {
    return getComputedStyle(document.body).getPropertyValue(varName).trim();
  }

  // --- Rendering Loop with Smooth Sub-Cell Interpolation ---
  function draw(interp) {
    CTX.clearRect(0, 0, 460, 460);

    // Screen Shake Offset
    let ox = 0, oy = 0;
    if (shakeTime > 0) {
      ox = (Math.random() - 0.5) * 6;
      oy = (Math.random() - 0.5) * 6;
      CTX.save();
      CTX.translate(ox, oy);
    }

    const gridColor = getThemeColor("--grid");
    const gridLine = getThemeColor("--grid-line");
    const snakeColor = getThemeColor("--snake");
    const headColor = getThemeColor("--snake-head");
    const foodColor = getThemeColor("--food");
    const bonusColor = getThemeColor("--bonus");
    const isNokia = theme === "nokia";

    // 1. Background & Grid
    CTX.fillStyle = gridColor;
    CTX.fillRect(0, 0, 460, 460);

    CTX.strokeStyle = gridLine;
    CTX.lineWidth = 1;
    for (let c = 1; c < COLS; c++) {
      CTX.beginPath(); CTX.moveTo(c * CELL, 0); CTX.lineTo(c * CELL, 460); CTX.stroke();
      CTX.beginPath(); CTX.moveTo(0, c * CELL); CTX.lineTo(460, c * CELL); CTX.stroke();
    }

    // 2. Bonus Food (Golden Star with countdown timer ring)
    if (bonusFood) {
      const bx = bonusFood.x * CELL + CELL / 2;
      const by = bonusFood.y * CELL + CELL / 2;
      const pct = Math.max(0, bonusFood.timeLeft / bonusFood.maxTime);

      // Countdown Ring
      CTX.strokeStyle = bonusColor;
      CTX.lineWidth = 2.5;
      CTX.beginPath();
      CTX.arc(bx, by, CELL / 2 + 2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
      CTX.stroke();

      // Pulsing Star Core
      const pulse = 1 + Math.sin(performance.now() * 0.008) * 0.15;
      CTX.save();
      CTX.translate(bx, by);
      CTX.scale(pulse, pulse);
      if (!isNokia) {
        CTX.shadowColor = bonusColor;
        CTX.shadowBlur = 12;
      }
      CTX.fillStyle = bonusColor;
      // Draw 5-pointed star
      CTX.beginPath();
      for (let i = 0; i < 5; i++) {
        CTX.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * (CELL / 2 - 2),
                   -Math.sin((18 + i * 72) * Math.PI / 180) * (CELL / 2 - 2));
        CTX.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (CELL / 4),
                   -Math.sin((54 + i * 72) * Math.PI / 180) * (CELL / 4));
      }
      CTX.closePath();
      CTX.fill();
      CTX.restore();
    }

    // 3. Regular Food (Glowing Apple / Orb)
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const foodPulse = 1 + Math.sin(performance.now() * 0.006) * 0.1;
    CTX.save();
    CTX.translate(fx, fy);
    CTX.scale(foodPulse, foodPulse);
    if (!isNokia) {
      CTX.shadowColor = foodColor;
      CTX.shadowBlur = 10;
    }
    CTX.fillStyle = foodColor;
    if (isNokia) {
      CTX.fillRect(-CELL / 2 + 3, -CELL / 2 + 3, CELL - 6, CELL - 6);
    } else {
      CTX.beginPath();
      CTX.arc(0, 0, CELL / 2 - 3, 0, Math.PI * 2);
      CTX.fill();
      // Little apple stem / leaf
      CTX.fillStyle = "#10b981";
      CTX.shadowBlur = 0;
      CTX.fillRect(-1, -CELL / 2 + 1, 2, 3);
    }
    CTX.restore();

    // 4. Snake Body & Interpolated Movement
    const t = Math.max(0, Math.min(1, interp));
    const smoothPoints = [];

    for (let i = 0; i < snake.length; i++) {
      const cur = snake[i];
      const prev = prevSnake[i] || cur;

      let px = prev.x;
      let py = prev.y;
      let cx = cur.x;
      let cy = cur.y;

      // Avoid interpolating across the full board during wrap-around
      if (Math.abs(cx - px) > 1 || Math.abs(cy - py) > 1) {
        px = cx;
        py = cy;
      }

      const renderX = px + (cx - px) * t;
      const renderY = py + (cy - py) * t;
      smoothPoints.push({ x: renderX, y: renderY });
    }

    // Draw snake body segments
    for (let i = smoothPoints.length - 1; i >= 0; i--) {
      const pt = smoothPoints[i];
      const cx = pt.x * CELL + CELL / 2;
      const cy = pt.y * CELL + CELL / 2;
      const isHead = (i === 0);

      // Body tapering toward tail
      const taper = isHead ? 1 : Math.max(0.65, 1 - (i / smoothPoints.length) * 0.35);
      const radius = (CELL / 2 - 1.5) * taper;

      CTX.save();
      if (!isNokia) {
        CTX.shadowColor = isHead ? headColor : snakeColor;
        CTX.shadowBlur = isHead ? 10 : 4;
      }
      CTX.fillStyle = isHead ? headColor : snakeColor;

      if (isNokia) {
        const sz = (CELL - 3) * taper;
        CTX.fillRect(cx - sz / 2, cy - sz / 2, sz, sz);
      } else {
        CTX.beginPath();
        CTX.arc(cx, cy, radius, 0, Math.PI * 2);
        CTX.fill();

        // Connect adjacent segments for a smooth continuous body
        if (i < smoothPoints.length - 1) {
          const nextPt = smoothPoints[i + 1];
          let nx = nextPt.x * CELL + CELL / 2;
          let ny = nextPt.y * CELL + CELL / 2;
          if (Math.hypot(nx - cx, ny - cy) < CELL * 1.5) {
            CTX.lineWidth = radius * 1.8;
            CTX.strokeStyle = snakeColor;
            CTX.lineCap = "round";
            CTX.beginPath();
            CTX.moveTo(cx, cy);
            CTX.lineTo(nx, ny);
            CTX.stroke();
          }
        }
      }
      CTX.restore();

      // Expressive Face on Snake Head
      if (isHead) {
        const headPt = smoothPoints[0];
        const hx = headPt.x * CELL + CELL / 2;
        const hy = headPt.y * CELL + CELL / 2;

        // Eye look direction based on movement
        const lookDir = dir;
        const eyeOffsetDist = 4.5;
        const eyeSpread = 5.5;

        // Normal perpendicular vector to direction
        const perpX = -lookDir.y;
        const perpY = lookDir.x;

        const leftEyeX = hx + lookDir.x * eyeOffsetDist + perpX * eyeSpread;
        const leftEyeY = hy + lookDir.y * eyeOffsetDist + perpY * eyeSpread;
        const rightEyeX = hx + lookDir.x * eyeOffsetDist - perpX * eyeSpread;
        const rightEyeY = hy + lookDir.y * eyeOffsetDist - perpY * eyeSpread;

        if (isNokia) {
          CTX.fillStyle = "#94a413";
          CTX.fillRect(leftEyeX - 1.5, leftEyeY - 1.5, 3, 3);
          CTX.fillRect(rightEyeX - 1.5, rightEyeY - 1.5, 3, 3);
        } else {
          // White of eye
          CTX.fillStyle = "#ffffff";
          CTX.beginPath();
          CTX.arc(leftEyeX, leftEyeY, 3, 0, Math.PI * 2);
          CTX.arc(rightEyeX, rightEyeY, 3, 0, Math.PI * 2);
          CTX.fill();

          // Pupil looking towards direction / food
          CTX.fillStyle = "#0f172a";
          const pupilShiftX = lookDir.x * 1.2;
          const pupilShiftY = lookDir.y * 1.2;
          CTX.beginPath();
          CTX.arc(leftEyeX + pupilShiftX, leftEyeY + pupilShiftY, 1.6, 0, Math.PI * 2);
          CTX.arc(rightEyeX + pupilShiftX, rightEyeY + pupilShiftY, 1.6, 0, Math.PI * 2);
          CTX.fill();

          // Subtle Tongue Flick when near food
          const distToFood = Math.hypot(food.x - snake[0].x, food.y - snake[0].y);
          if (distToFood <= 3) {
            tongueProgress = (tongueProgress + 0.15) % (Math.PI * 2);
            const tongueLen = 4 + Math.sin(tongueProgress) * 4;
            const tx = hx + lookDir.x * (CELL / 2 + tongueLen);
            const ty = hy + lookDir.y * (CELL / 2 + tongueLen);
            CTX.strokeStyle = "#f43f5e";
            CTX.lineWidth = 1.5;
            CTX.beginPath();
            CTX.moveTo(hx + lookDir.x * (CELL / 2 - 1), hy + lookDir.y * (CELL / 2 - 1));
            CTX.lineTo(tx, ty);
            // Little forked tip
            CTX.lineTo(tx + perpX * 2, ty + perpY * 2);
            CTX.moveTo(tx, ty);
            CTX.lineTo(tx - perpX * 2, ty - perpY * 2);
            CTX.stroke();
          }
        }
      }
    }

    // 5. Particles Update & Draw
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      CTX.save();
      CTX.globalAlpha = p.life;
      CTX.fillStyle = p.color;
      CTX.beginPath();
      CTX.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      CTX.fill();
      CTX.restore();
    }

    // 6. Floating Text Popups
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const ft = floatTexts[i];
      ft.y += ft.vy;
      ft.alpha -= 0.025;
      if (ft.alpha <= 0) {
        floatTexts.splice(i, 1);
        continue;
      }
      CTX.save();
      CTX.globalAlpha = ft.alpha;
      CTX.fillStyle = ft.color;
      CTX.font = "bold 13px " + getThemeColor("--font");
      CTX.textAlign = "center";
      CTX.fillText(ft.text, ft.x, ft.y);
      CTX.restore();
    }

    if (shakeTime > 0) {
      CTX.restore();
    }
  }

  // --- Main Animation Frame Loop ---
  function loop(ts) {
    requestAnimationFrame(loop);

    if (!lastTime) lastTime = ts;
    const delta = ts - lastTime;
    lastTime = ts;

    if (shakeTime > 0) {
      shakeTime = Math.max(0, shakeTime - delta);
    }

    // Bonus food timer
    if (bonusFood && alive && !paused) {
      bonusFood.timeLeft -= delta;
      if (bonusFood.timeLeft <= 0) {
        bonusFood = null;
      }
    }

    if (alive && !paused) {
      acc += delta;
      while (acc >= tickMs) {
        acc -= tickMs;
        step();
      }
    }

    const interp = (alive && !paused && tickMs > 0) ? (acc / tickMs) : 1;
    draw(interp);
  }

  // --- Input Handling & Turn Queueing ---
  const KEY_DIRS = {
    ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 }, k: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 }, j: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 }, h: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 }, l: { x: 1, y: 0 },
  };

  function requestDirection(newDir) {
    if (!newDir) return;
    initAudio();

    // Check against last scheduled direction to prevent instant 180-degree self-collision
    const lastScheduled = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : dir;
    if (newDir.x === -lastScheduled.x && newDir.y === -lastScheduled.y) {
      return; // Disallow 180 reversal
    }
    if (newDir.x === lastScheduled.x && newDir.y === lastScheduled.y) {
      return; // Ignore duplicate direction
    }
    if (inputQueue.length < 2) {
      inputQueue.push(newDir);
    }
  }

  window.addEventListener("keydown", e => {
    // Audio unlock on user gesture
    initAudio();

    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      if (!alive) {
        reset();
      } else {
        togglePause();
      }
      return;
    }
    if (e.key === "r" || e.key === "R") {
      e.preventDefault();
      reset();
      return;
    }
    if (e.key === "m" || e.key === "M") {
      e.preventDefault();
      soundEnabled = !soundEnabled;
      try { localStorage.setItem(STORAGE_SOUND, String(soundEnabled)); } catch (_) {}
      updateSoundUI();
      return;
    }
    if (e.key === "t" || e.key === "T") {
      e.preventDefault();
      cycleTheme();
      return;
    }
    if (e.key === "p" || e.key === "P") {
      e.preventDefault();
      togglePause();
      return;
    }
    if (e.key === "Enter") {
      if (!alive || paused) {
        e.preventDefault();
        if (paused) togglePause();
        else reset();
        return;
      }
    }

    const nd = KEY_DIRS[e.code] || KEY_DIRS[e.key];
    if (nd) {
      e.preventDefault();
      requestDirection(nd);
    }
  });

  // --- Mobile Touch Gestures (Swipe) ---
  let touchStart = null;
  CANVAS.addEventListener("touchstart", e => {
    initAudio();
    if (e.touches.length) {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, { passive: true });

  CANVAS.addEventListener("touchmove", e => {
    if (touchStart) e.preventDefault();
  }, { passive: false });

  CANVAS.addEventListener("touchend", e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;

    if (Math.abs(dx) < 16 && Math.abs(dy) < 16) {
      // Tap on canvas when paused or dead
      if (!alive) reset();
      return;
    }

    if (Math.abs(dx) > Math.abs(dy)) {
      requestDirection({ x: dx > 0 ? 1 : -1, y: 0 });
    } else {
      requestDirection({ x: 0, y: dy > 0 ? 1 : -1 });
    }
  }, { passive: true });

  // --- Mobile Virtual D-Pad Click Events ---
  UI.dpad.addEventListener("click", e => {
    const btn = e.target.closest(".dpad-btn");
    if (!btn) return;
    const d = btn.getAttribute("data-dir");
    if (d === "up") requestDirection({ x: 0, y: -1 });
    else if (d === "down") requestDirection({ x: 0, y: 1 });
    else if (d === "left") requestDirection({ x: -1, y: 0 });
    else if (d === "right") requestDirection({ x: 1, y: 0 });
    triggerHaptic(10);
  });

  // --- UI Action Buttons ---
  UI.overlayActionBtn.addEventListener("click", () => {
    initAudio();
    playClickSound();
    reset();
  });

  UI.overlayResumeBtn.addEventListener("click", () => {
    togglePause();
  });

  UI.pauseBtn.addEventListener("click", () => {
    togglePause();
  });

  UI.soundToggle.addEventListener("click", () => {
    initAudio();
    soundEnabled = !soundEnabled;
    try { localStorage.setItem(STORAGE_SOUND, String(soundEnabled)); } catch (_) {}
    updateSoundUI();
    if (soundEnabled) playClickSound();
  });

  const THEMES = ["neon", "nokia", "synthwave", "midnight"];
  function cycleTheme() {
    const currIdx = THEMES.indexOf(theme);
    const nextTheme = THEMES[(currIdx + 1) % THEMES.length];
    setTheme(nextTheme);
  }

  function setTheme(newTheme) {
    theme = newTheme;
    document.body.setAttribute("data-theme", theme);
    UI.themeSelect.value = theme;
    try { localStorage.setItem(STORAGE_THEME, theme); } catch (_) {}
    playClickSound();
  }

  UI.themeToggle.addEventListener("click", () => {
    initAudio();
    cycleTheme();
  });

  UI.themeSelect.addEventListener("change", e => {
    initAudio();
    setTheme(e.target.value);
  });

  UI.modeSelect.addEventListener("change", e => {
    initAudio();
    mode = e.target.value;
    try { localStorage.setItem(STORAGE_MODE, mode); } catch (_) {}
    updateBestScoreDisplay();
    reset();
  });

  UI.speedSelect.addEventListener("change", e => {
    initAudio();
    speedPreset = e.target.value;
    try { localStorage.setItem(STORAGE_SPEED, speedPreset); } catch (_) {}
    updateBestScoreDisplay();
    reset();
  });

  // Start the game!
  reset();
  lastTime = performance.now();
  requestAnimationFrame(loop);

  // Test-only export for Node.js unit tests
  if (typeof module !== "undefined" && module.exports) {
    module.exports = {
      _test: {
        reset, step, placeFood,
        state: () => ({ snake, dir, inputQueue, food, bonusFood, score, best, alive, paused, mode, tickMs }),
        requestDirection,
        setMode: m => { mode = m; },
        setSpeedPreset: s => { speedPreset = s; },
        setSnake: s => { snake = s; prevSnake = s.map(pt => ({ ...pt })); },
        setFood: p => { food = p; },
        setBonusFood: b => { bonusFood = b; }
      }
    };
  }
})();
</script>
</body>
</html>
